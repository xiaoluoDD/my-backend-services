# 手机只读项目看板 — Nginx 配置示例
#
# 使用前请替换：
#   @WEB_ROOT@  → web 静态文件目录，推荐 /var/www/project-show-web
#
# 安装示例（Ubuntu）：
#   sudo cp deploy/nginx-mobile.conf /etc/nginx/sites-available/project-mobile
#   sudo sed -i 's|@WEB_ROOT@|/var/www/project-show-web|g' /etc/nginx/sites-available/project-mobile
#   sudo ln -sf /etc/nginx/sites-available/project-mobile /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 访问地址：http://<服务器IP>:8080/mobile/index.html
#
# 若 80 端口由 Caddy 等公司站点占用，本项目 Nginx 监听 8080；
# 安全组 / UFW 需放行 TCP 8080。

server {
    listen 8080;
    server_name _;

    # 手机看板静态页（ProjectShow/web 整个目录上传到 @WEB_ROOT@）
    location /mobile/ {
        alias @WEB_ROOT@/;
        index index.html;
    }

    # 只读 Web 需要的 API（反代到本机 Go 服务）
    location /api/projects {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/project-subtasks {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/dashboard/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/auth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/accounts {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/changelog {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 新建/编辑项目选人：部门与企微成员（只读 GET）
    location /api/departments {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/wecom/users {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
