# 手机只读项目看板 — Nginx 配置示例
#
# 使用前请替换：
#   @WEB_CURRENT@  → 正式版目录，推荐 /var/www/projectshow-web/current
#   @WEB_PREVIEW@  → 预览版目录，推荐 /var/www/projectshow-web/preview
#
# 安装示例（Ubuntu）：
#   sudo cp deploy/nginx-mobile.conf /etc/nginx/sites-available/project-mobile
#   sudo sed -i 's|@WEB_CURRENT@|/var/www/projectshow-web/current|g' /etc/nginx/sites-available/project-mobile
#   sudo sed -i 's|@WEB_PREVIEW@|/var/www/projectshow-web/preview|g' /etc/nginx/sites-available/project-mobile
#   sudo ln -sf /etc/nginx/sites-available/project-mobile /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 访问地址：http://<服务器IP>:8080/mobile/index.html
#
# 若 80 端口由 Caddy 等公司站点占用，本项目 Nginx 监听 8080；
# 安全组 / UFW 需放行 TCP 8080。

server {
    listen 8080;
    server_name _;

    # 正式版：用户一直访问这个地址
    location /mobile/ {
        alias @WEB_CURRENT@/;
        index index.html;
    }

    # 预览版：发布后先看这里，确认没问题再切正式版
    location /mobile-preview/ {
        alias @WEB_PREVIEW@/;
        index index.html;
    }

    # 全部 /api/* 反代到本机 Go 服务（设置/提醒/日志/DB 导出等运维接口也走这里）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 导出快照 / 下载数据库可能较大
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}
